<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>Facility Feedback</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="facility-types.js?v=20261004k"></script>
<script src="facility-supabase.js?v=20261004k"></script>
<style>
  :root {
    --font-text: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-display: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --gold: #C4A265;
    --gold-light: #D9C48E;
    --gold-dark: #A8894F;
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #1d1d1f;
    --text-muted: #6e6e73;
    --text-soft: #86868b;
    --border: #e8e8ed;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-synthesis: none; }
  html {
    font-family: var(--font-text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .app {
    position: relative;
    width: 100%;
    max-width: 480px;
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--surface);
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.06);
    display: flex;
    flex-direction: column;
  }

  .viewport { position: relative; flex: 1; overflow: hidden; }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 24px 28px 32px;
    visibility: hidden;
    transform: translateX(100%);
    transition: transform 0.32s var(--ease);
    pointer-events: none;
  }
  .screen.active {
    visibility: visible;
    transform: translateX(0);
    pointer-events: auto;
    z-index: 2;
  }
  .screen.prepare-left { transform: translateX(-100%); transition: none; }
  .screen.exit-left {
    visibility: visible;
    transform: translateX(-100%);
    pointer-events: none;
    z-index: 1;
  }
  .screen.exit-right {
    visibility: visible;
    transform: translateX(100%);
    pointer-events: none;
    z-index: 1;
  }

  .screen-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    width: 100%;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .screen-body::-webkit-scrollbar { display: none; width: 0; height: 0; }

  .screen-footer {
    flex-shrink: 0;
    padding-top: 16px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .question-icon {
    width: 96px;
    height: 96px;
    margin: 0 auto 16px;
    border: 0;
    background: transparent;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .question-icon object,
  .question-icon img {
    width: 96px;
    height: 96px;
    border: 0;
    background: transparent;
    display: block;
    pointer-events: none;
  }
  .question-icon.is-thinking object,
  .question-icon.is-thinking img {
    width: 100px;
    height: 100px;
  }

  #rateIcon {
    width: 120px;
    height: 120px;
    margin: -48px auto 8px;
    overflow: visible;
  }
  #rateIcon object {
    width: 120px;
    height: 120px;
    transform: translateY(-58px);
  }

  .question-title {
    font-family: var(--font-display);
    font-size: clamp(22px, 5.5vw, 26px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.25;
    max-width: 360px;
    margin-bottom: 24px;
  }

  .stars {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
  }
  .star-btn {
    appearance: none;
    border: none;
    background: none;
    padding: 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .star-btn svg { width: 42px; height: 42px; display: block; }
  .star-btn svg path {
    fill: #e8e8ed;
    transition: fill 0.3s var(--ease);
  }
  .star-btn.on svg path,
  .star-btn.hover-preview svg path { fill: var(--gold); }
  .stars.is-idle .star-btn:nth-child(-n + 3) svg path {
    fill: rgba(196, 162, 101, 0.32);
  }
  .stars.is-idle .star-btn.hover-preview svg path { fill: var(--gold); }

  .rating-hint {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-soft);
    min-height: 22px;
    margin-bottom: 8px;
  }

  .issue-sub {
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 16px;
  }

  .issue-chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .issue-chip {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-family: var(--font-text);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 100px;
    cursor: pointer;
  }
  .issue-chip.is-on {
    background: rgba(196, 162, 101, 0.14);
    border-color: rgba(196, 162, 101, 0.55);
    color: var(--gold-dark);
  }

  .note-toggle {
    appearance: none;
    border: 0;
    background: none;
    color: var(--text-soft);
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px;
    margin: 0 auto;
  }
  .note-toggle:hover { color: var(--text-muted); }

  /* Improve screen: pin content from top so opening the note doesn't re-center / shift up */
  .screen-improve .screen-body {
    justify-content: flex-start;
    align-items: center;
    padding-top: clamp(28px, 8vh, 72px);
  }
  .screen-improve .improve-main {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
  }
  .screen-improve .note-wrap {
    width: 100%;
    max-width: 360px;
    margin-top: 8px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .note-panel {
    width: 100%;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.28s var(--ease);
  }
  .note-panel.is-on { grid-template-rows: 1fr; }
  .note-panel-inner {
    overflow: hidden;
    min-height: 0;
  }
  .note-field {
    display: block;
    width: 100%;
    min-height: 88px;
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    font: inherit;
    font-size: 15px;
    resize: vertical;
    background: var(--bg);
    color: var(--text);
  }
  .note-field:focus {
    outline: none;
    border-color: rgba(196, 162, 101, 0.7);
    box-shadow: 0 0 0 4px rgba(196, 162, 101, 0.16);
    background: #fff;
  }

  .btn {
    appearance: none;
    border: none;
    width: 100%;
    padding: 16px 24px;
    border-radius: 14px;
    font-family: var(--font-text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    color: #fff;
    box-shadow: 0 8px 24px rgba(196, 162, 101, 0.35);
  }

  .submit-error {
    font-size: 13px;
    color: #b42318;
    min-height: 18px;
    text-align: center;
  }

  .error-banner {
    display: none;
    margin: 16px 28px 0;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(180, 35, 24, 0.08);
    color: #b42318;
    font-size: 13px;
  }
  .error-banner.is-on { display: block; }

  .thank-circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(196, 162, 101, 0.12);
    border: 1px solid rgba(196, 162, 101, 0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .thank-circle svg { width: 48px; height: 48px; }
  .thank-circle path {
    fill: none;
    stroke: var(--gold);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .screen h1 {
    font-family: var(--font-display);
    font-size: clamp(28px, 7vw, 34px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 16px;
  }
  .lead {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-muted);
    max-width: 340px;
  }

  @media (min-width: 520px) {
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .app {
      min-height: min(720px, 90dvh);
      border-radius: 24px;
      overflow: hidden;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="error-banner" id="errorBanner"></div>
    <main class="viewport" id="viewport"></main>
  </div>

<script>
(function () {
  const ISSUE_THRESHOLD = 3;
  const RATING_LABELS = ['Tap to rate', 'Poor', 'Fair', 'Good', 'Very good', 'Excellent'];
  const SLIDE_MS = 320;

  const { facilityId, source } = FacilityKit.parseFeedbackParams();
  let facility = FacilityKit.resolveFromCode(facilityId) || {
    id: facilityId || 'UNKNOWN',
    typeCode: 'PR',
    typeName: 'Facility',
    name: 'Facility',
    property: '',
    location: '',
    ephemeral: true
  };
  let type = FacilityKit.FACILITY_TYPES[facility.typeCode] || FacilityKit.FACILITY_TYPES.PR;

  const state = { rating: 0, issues: [], comment: '' };
  let step = 0;
  let busy = false;
  let submitting = false;

  const viewport = document.getElementById('viewport');
  const errorBanner = document.getElementById('errorBanner');

  // Animated SVGs (SMIL) — must use <object>, not <img>, to keep animation playing
  const RATE_ICON = '<object data="icon-rate.svg?v=18" type="image/svg+xml" width="120" height="120" aria-label="Review"></object>';
  const IMPROVE_ICON = '<object data="icon-improve.svg?v=2" type="image/svg+xml" width="92" height="92" aria-label="Thinking"></object>';

  function starSvg() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
  }

  function showError(msg) {
    errorBanner.textContent = msg || '';
    errorBanner.classList.toggle('is-on', !!msg);
  }

  function buildRate() {
    const el = document.createElement('section');
    el.className = 'screen';
    const stars = [1,2,3,4,5].map(n =>
      '<button type="button" class="star-btn" data-star="' + n + '" aria-label="' + n + ' star' + (n > 1 ? 's' : '') + '">' + starSvg() + '</button>'
    ).join('');
    el.innerHTML =
      '<div class="screen-body">' +
        '<div class="question-icon" id="rateIcon" aria-hidden="true">' + RATE_ICON + '</div>' +
        '<h2 class="question-title" id="rateTitle">How was the Facility?</h2>' +
        '<div class="stars is-idle" id="stars" role="group" aria-label="Rating">' + stars + '</div>' +
        '<p class="rating-hint" id="ratingHint">Tap to rate</p>' +
      '</div>';
    return el;
  }

  function buildImprove() {
    const el = document.createElement('section');
    el.className = 'screen screen-improve';
    el.innerHTML =
      '<div class="screen-body">' +
        '<div class="improve-main">' +
          '<div class="question-icon is-thinking" aria-hidden="true">' + IMPROVE_ICON + '</div>' +
          '<h2 class="question-title">What can we improve?</h2>' +
          '<p class="issue-sub">Select all that apply — it helps us improve.</p>' +
          '<div class="issue-chips" id="chips" role="group" aria-label="Improvement areas"></div>' +
        '</div>' +
        '<div class="note-wrap">' +
          '<button type="button" class="note-toggle" id="noteToggle">Add a note</button>' +
          '<div class="note-panel" id="notePanel">' +
            '<div class="note-panel-inner">' +
              '<textarea class="note-field" id="comment" placeholder="Anything else? (optional)" maxlength="500"></textarea>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="screen-footer">' +
        '<button type="button" class="btn btn-primary" id="btnSubmit">Submit</button>' +
        '<p class="submit-error" id="submitError"></p>' +
      '</div>';
    return el;
  }

  function buildThanks() {
    const el = document.createElement('section');
    el.className = 'screen screen-thank';
    el.innerHTML =
      '<div class="screen-body">' +
        '<div class="thank-circle"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>' +
        '<h1>Thank you</h1>' +
        '<p class="lead" id="thanksLead">Your feedback has been recorded.</p>' +
      '</div>';
    return el;
  }

  const screens = [buildRate(), buildImprove(), buildThanks()];
  screens.forEach(s => viewport.appendChild(s));
  screens[0].classList.add('active');

  const starWrap = document.getElementById('stars');
  const ratingHint = document.getElementById('ratingHint');
  const chipsEl = document.getElementById('chips');
  const noteToggle = document.getElementById('noteToggle');
  const commentEl = document.getElementById('comment');
  const btnSubmit = document.getElementById('btnSubmit');
  const submitError = document.getElementById('submitError');
  const rateTitle = document.getElementById('rateTitle');
  const thanksLead = document.getElementById('thanksLead');

  function renderChips() {
    chipsEl.innerHTML = '';
    (type.improve || []).forEach(opt => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'issue-chip';
      chip.dataset.issue = opt;
      chip.setAttribute('aria-pressed', 'false');
      chip.textContent = opt;
      chip.addEventListener('click', () => {
        const on = !chip.classList.contains('is-on');
        chip.classList.toggle('is-on', on);
        chip.setAttribute('aria-pressed', on ? 'true' : 'false');
        const set = new Set(state.issues);
        if (on) set.add(opt); else set.delete(opt);
        state.issues = Array.from(set);
      });
      chipsEl.appendChild(chip);
    });
  }

  function paintFacility() {
    type = FacilityKit.FACILITY_TYPES[facility.typeCode] || FacilityKit.FACILITY_TYPES.PR;
    document.title = 'Feedback · ' + facility.name;
    rateTitle.textContent = 'How was the ' + facility.name + '?';
    thanksLead.textContent = 'Your ' + facility.name + ' feedback has been recorded.';
    renderChips();
  }

  function paintStars(value, previewOnly) {
    const idle = !previewOnly && value <= 0;
    starWrap.classList.toggle('is-idle', idle);
    starWrap.querySelectorAll('.star-btn').forEach(btn => {
      const n = +btn.dataset.star;
      btn.classList.toggle('on', !previewOnly && value > 0 && n <= value);
      btn.classList.toggle('hover-preview', previewOnly && n <= value);
    });
    if (!previewOnly) {
      state.rating = value;
      ratingHint.textContent = RATING_LABELS[value] || RATING_LABELS[0];
    }
  }

  function showStep(next, dir) {
    if (busy || next === step) return;
    busy = true;
    const current = screens[step];
    const upcoming = screens[next];
    upcoming.classList.remove('exit-left', 'exit-right', 'prepare-left', 'active');
    if (dir < 0) upcoming.classList.add('prepare-left');
    void upcoming.offsetWidth;
    current.classList.remove('active');
    current.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
    upcoming.classList.add('active');
    upcoming.classList.remove('prepare-left');
    step = next;
    setTimeout(() => {
      current.classList.remove('exit-left', 'exit-right', 'active');
      busy = false;
    }, SLIDE_MS);
  }

  async function submit() {
    if (submitting || !state.rating) return;
    submitting = true;
    btnSubmit.disabled = true;
    submitError.textContent = '';
    showError('');

    const payload = {
      facilityId: facility.id,
      facilityType: facility.typeCode,
      facilityTypeName: facility.typeName,
      facilityName: facility.name,
      property: facility.property || '',
      location: facility.location || '',
      building: facility.building || '',
      floor: facility.floor || '',
      zone: facility.zone || '',
      source: source || 'web',
      rating: state.rating,
      issues: state.issues.slice(),
      comment: (commentEl.value || '').trim(),
      userAgent: navigator.userAgent,
      submittedAt: new Date().toISOString(),
      pageUrl: location.href
    };

    try {
      const backups = JSON.parse(localStorage.getItem('rsgFeedbackSubmissions') || '[]');
      backups.unshift(payload);
      localStorage.setItem('rsgFeedbackSubmissions', JSON.stringify(backups.slice(0, 200)));
      await FacilitySupabase.submitFeedback(payload);
      showStep(2, 1);
    } catch (err) {
      console.error(err);
      submitError.textContent = 'Could not send just now. Please try again.';
      btnSubmit.disabled = false;
      submitting = false;
    }
  }

  starWrap.querySelectorAll('.star-btn').forEach(btn => {
    const n = +btn.dataset.star;
    btn.addEventListener('click', () => {
      if (busy || submitting) return;
      paintStars(n, false);
      if (n <= ISSUE_THRESHOLD) showStep(1, 1);
      else submit();
    });
    btn.addEventListener('mouseenter', () => {
      starWrap.classList.remove('is-idle');
      paintStars(n, true);
    });
    btn.addEventListener('mouseleave', () => {
      starWrap.querySelectorAll('.star-btn').forEach(b => b.classList.remove('hover-preview'));
      paintStars(state.rating, false);
    });
  });

  const notePanel = document.getElementById('notePanel');
  noteToggle.addEventListener('click', () => {
    const on = notePanel.classList.toggle('is-on');
    noteToggle.textContent = on ? 'Hide note' : 'Add a note';
    if (on) {
      // Keep page content anchored; only expand field downward
      requestAnimationFrame(() => commentEl.focus());
    }
  });

  btnSubmit.addEventListener('click', submit);

  paintFacility();

  if (!facilityId) {
    showError('Missing facility code. Open this page from a QR code or NFC tag (e.g. ?f=PR-001&s=qr).');
  } else {
    FacilitySupabase.getFacility(facilityId).then(remote => {
      if (remote) {
        facility = remote;
        paintFacility();
      }
    }).catch(err => console.warn('Could not load facility from Supabase', err));
  }
})();
</script>
</body>
</html>
