<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facility Feedback Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="facility-types.js"></script>
<script src="facility-supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #F3EEE6;
    --ink: #1F2A24;
    --muted: #6E736E;
    --line: #D9D2C6;
    --gold: #C5A059;
    --card: #FFFCF7;
    --ok: #2F6B4F;
    --danger: #A33B3B;
    --font: "Montserrat", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --serif: "Playfair Display", "Times New Roman", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: linear-gradient(180deg, #F7F2EA, var(--bg));
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    padding: 22px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,252,247,0.9);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.82rem; }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 22px;
  }
  @media (max-width: 960px) {
    .wrap { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(31,42,36,0.04);
  }
  .panel h2 {
    font-size: 0.95rem;
    margin: 0 0 14px;
    letter-spacing: 0.02em;
  }
  label {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 12px 0 6px;
  }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,149,90,0.15);
  }
  textarea { min-height: 70px; resize: vertical; }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .btn {
    border: 0;
    border-radius: 999px;
    padding: 11px 18px;
    font: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary { background: var(--ink); color: #fff; width: 100%; margin-top: 16px; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .btn-danger {
    background: transparent;
    border: 1px solid #E8C4C4;
    color: var(--danger);
  }
  .btn-sm { padding: 7px 12px; font-size: 0.78rem; }
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    align-items: center;
  }
  .toolbar input[type="search"] { max-width: 240px; }
  .settings-inline {
    display: flex;
    gap: 8px;
    align-items: end;
    flex-wrap: wrap;
    margin-bottom: 14px;
    padding: 12px;
    background: #F8F3EA;
    border-radius: 12px;
    border: 1px solid var(--line);
  }
  .settings-inline > div { flex: 1; min-width: 180px; }
  .settings-inline label { margin-top: 0; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  th, td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .id { font-weight: 700; letter-spacing: 0.02em; }
  .muted { color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .urls { font-size: 0.72rem; color: var(--muted); word-break: break-all; margin-top: 4px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }

  /* Print sign modal */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,24,22,0.55);
    z-index: 20;
    padding: 20px;
    overflow: auto;
  }
  .modal.is-on { display: grid; place-items: start center; }
  .modal-inner {
    background: #fff;
    border-radius: 16px;
    width: min(920px, 100%);
    margin: 20px auto;
    padding: 18px;
  }
  .modal-bar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .size-tabs { display: flex; gap: 6px; }
  .size-tabs button.is-on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Printable sign — user template */
  .sign-stage {
    display: grid;
    place-items: center;
    background: #dedbd5;
    border-radius: 12px;
    padding: 20px;
    overflow: auto;
  }

  .page {
    --cream: #f7f2e9;
    --green: #173b30;
    --gold: #b99a52;

    position: relative;
    width: min(100%, 794px);
    aspect-ratio: 210 / 297;
    background:
      radial-gradient(circle at 50% 38%, rgba(255,255,255,.28), transparent 65%),
      var(--cream);
    overflow: hidden;
    padding: 90px 76px 65px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.06);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--green);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page.size-a4 { width: 210mm; height: 297mm; aspect-ratio: auto; }
  .page.size-a5 {
    width: 148mm; height: 210mm; aspect-ratio: auto;
    padding: 56px 48px 42px;
  }
  .page.size-a6 {
    width: 105mm; height: 148mm; aspect-ratio: auto;
    padding: 40px 32px 30px;
  }
  .page.size-sticker {
    width: 100mm; height: 140mm; aspect-ratio: auto;
    padding: 36px 28px 28px;
  }

  .page .frame {
    position: absolute;
    inset: 27px;
    width: calc(100% - 54px);
    height: calc(100% - 54px);
    pointer-events: none;
  }
  .page.size-a5 .frame { inset: 18px; width: calc(100% - 36px); height: calc(100% - 36px); }
  .page.size-a6 .frame { inset: 14px; width: calc(100% - 28px); height: calc(100% - 28px); }
  .page.size-sticker .frame { inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); }
  .page .frame path {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.2;
    vector-effect: non-scaling-stroke;
  }

  .page .lotus-row {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 17px;
  }
  .page.size-a5 .lotus-row { margin-top: 14px; gap: 12px; }
  .page.size-a6 .lotus-row { margin-top: 10px; gap: 9px; }
  .page.size-sticker .lotus-row { margin-top: 8px; gap: 8px; }
  .page .lotus-line { width: 105px; height: 1px; background: var(--gold); }
  .page.size-a5 .lotus-line { width: 70px; }
  .page.size-a6 .lotus-line { width: 52px; }
  .page.size-sticker .lotus-line { width: 44px; }
  .page .lotus { width: 52px; height: 40px; color: var(--gold); }
  .page.size-a5 .lotus { width: 36px; height: 28px; }
  .page.size-a6 .lotus { width: 30px; height: 23px; }
  .page.size-sticker .lotus { width: 26px; height: 20px; }
  .page .lotus path {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .page .small-title {
    margin-top: 34px;
    font-size: 25px;
    font-weight: 400;
    letter-spacing: .30em;
    line-height: 1;
    white-space: nowrap;
  }
  .page.size-a5 .small-title { margin-top: 20px; font-size: 16px; letter-spacing: .24em; }
  .page.size-a6 .small-title { margin-top: 14px; font-size: 12px; letter-spacing: .2em; }
  .page.size-sticker .small-title { margin-top: 12px; font-size: 11px; letter-spacing: .18em; }

  .page .main-title {
    margin-top: 24px;
    font-size: 72px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -.045em;
    white-space: nowrap;
    text-align: center;
    max-width: 100%;
  }
  .page.size-a5 .main-title { margin-top: 14px; font-size: 46px; }
  .page.size-a6 .main-title { margin-top: 12px; font-size: 34px; }
  .page.size-sticker .main-title { margin-top: 10px; font-size: 28px; }
  .page .main-title.is-long { font-size: 52px; letter-spacing: -.03em; }
  .page.size-a5 .main-title.is-long { font-size: 34px; }
  .page.size-a6 .main-title.is-long { font-size: 24px; }
  .page.size-sticker .main-title.is-long { font-size: 20px; }
  .page .main-title.is-xl { font-size: 40px; white-space: normal; }
  .page.size-a5 .main-title.is-xl { font-size: 28px; }
  .page.size-a6 .main-title.is-xl { font-size: 18px; }
  .page.size-sticker .main-title.is-xl { font-size: 16px; }

  .page .divider {
    width: 400px;
    max-width: 72%;
    display: flex;
    align-items: center;
    gap: 17px;
    margin-top: 55px;
    margin-bottom: 31px;
  }
  .page.size-a5 .divider { margin-top: 32px; margin-bottom: 20px; gap: 12px; }
  .page.size-a6 .divider { margin-top: 22px; margin-bottom: 14px; gap: 9px; }
  .page.size-sticker .divider { margin-top: 18px; margin-bottom: 12px; gap: 8px; }
  .page .divider-line { flex: 1; height: 1px; background: var(--gold); }
  .page .divider-dot {
    width: 9px; height: 9px; flex-shrink: 0;
    border-radius: 50%; background: var(--gold);
  }
  .page.size-a6 .divider-dot { width: 7px; height: 7px; }
  .page.size-sticker .divider-dot { width: 6px; height: 6px; }
  .page .lower-divider { margin-top: 39px; margin-bottom: 27px; }
  .page.size-a5 .lower-divider { margin-top: 24px; margin-bottom: 16px; }
  .page.size-a6 .lower-divider { margin-top: 16px; margin-bottom: 12px; }
  .page.size-sticker .lower-divider { margin-top: 14px; margin-bottom: 10px; }

  .page .ratings {
    width: 100%;
    max-width: 585px;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    column-gap: 30px;
    align-items: center;
  }
  .page.size-a5 .ratings { column-gap: 18px; }
  .page.size-a6 .ratings { column-gap: 12px; }
  .page.size-sticker .ratings { column-gap: 10px; }
  .page .rating {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .page .rating-circle {
    width: 220px;
    height: 220px;
    border: 1.3px solid var(--green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page.size-a5 .rating-circle { width: 140px; height: 140px; }
  .page.size-a6 .rating-circle { width: 100px; height: 100px; }
  .page.size-sticker .rating-circle { width: 88px; height: 88px; }
  .page .feedback-icon {
    width: 108px;
    height: 108px;
    display: block;
    object-fit: contain;
  }
  .page.size-a5 .feedback-icon { width: 68px; height: 68px; }
  .page.size-a6 .feedback-icon { width: 48px; height: 48px; }
  .page.size-sticker .feedback-icon { width: 42px; height: 42px; }
  .page .feedback-icon.down { transform: rotate(180deg); }
  .page .vertical-line {
    width: 1px;
    height: 180px;
    background: var(--gold);
  }
  .page.size-a5 .vertical-line { height: 110px; }
  .page.size-a6 .vertical-line { height: 80px; }
  .page.size-sticker .vertical-line { height: 70px; }
  .page .rating-label {
    margin-top: 18px;
    font-size: 19px;
    font-weight: 400;
    letter-spacing: .15em;
    line-height: 1;
    white-space: nowrap;
  }
  .page.size-a5 .rating-label { margin-top: 12px; font-size: 13px; }
  .page.size-a6 .rating-label { margin-top: 9px; font-size: 10px; letter-spacing: .12em; }
  .page.size-sticker .rating-label { margin-top: 8px; font-size: 9px; letter-spacing: .1em; }

  .page .qr-frame {
    width: 147px;
    height: 147px;
    border: 1.25px solid var(--gold);
    border-radius: 14px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    box-sizing: border-box;
    line-height: 0;
  }
  .page.size-a5 .qr-frame { width: 110px; height: 110px; border-radius: 11px; padding: 8px; }
  .page.size-a6 .qr-frame { width: 88px; height: 88px; border-radius: 10px; padding: 7px; }
  .page.size-sticker .qr-frame { width: 78px; height: 78px; border-radius: 9px; padding: 6px; }
  .page .qr-frame #signQr {
    width: 100% !important;
    height: 100% !important;
    display: grid !important;
    place-items: center;
  }
  .page .qr-frame #signQr img,
  .page .qr-frame #signQr canvas {
    width: 100% !important;
    height: 100% !important;
    image-rendering: pixelated;
  }

  .page .nfc-area {
    margin-top: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .page.size-a5 .nfc-area { margin-top: 32px; }
  .page.size-a6 .nfc-area { margin-top: 22px; }
  .page.size-sticker .nfc-area { margin-top: 18px; }
  .page .nfc-row {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .page .nfc-line { width: 54px; height: 1px; background: var(--gold); }
  .page.size-a6 .nfc-line { width: 36px; }
  .page.size-sticker .nfc-line { width: 28px; }
  .page .nfc-icon { width: 40px; height: 40px; color: var(--gold); }
  .page.size-a5 .nfc-icon { width: 30px; height: 30px; }
  .page.size-a6 .nfc-icon { width: 24px; height: 24px; }
  .page.size-sticker .nfc-icon { width: 22px; height: 22px; }
  .page .nfc-icon path {
    fill: none;
    stroke: currentColor;
    stroke-width: 3;
    stroke-linecap: round;
  }
  .page .nfc-title {
    margin-top: 0;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .16em;
  }
  .page.size-a5 .nfc-title { font-size: 12px; }
  .page.size-a6 .nfc-title { font-size: 10px; }
  .page.size-sticker .nfc-title { font-size: 9px; }
  .page .tap-text {
    margin-top: 9px;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: .18em;
    white-space: nowrap;
  }
  .page.size-a5 .tap-text { font-size: 11px; margin-top: 6px; }
  .page.size-a6 .tap-text { font-size: 9px; margin-top: 5px; letter-spacing: .14em; }
  .page.size-sticker .tap-text { font-size: 8px; margin-top: 4px; letter-spacing: .12em; }
  .sign-id { display: none; }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--ink);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: .2s ease;
    z-index: 30;
  }
  .toast.is-on { opacity: 1; }

  @media print {
    body * { visibility: hidden !important; }
    .modal, .modal * { visibility: visible !important; }
    .modal {
      display: block !important;
      position: static !important;
      background: #fff !important;
      padding: 0 !important;
    }
    .modal-inner {
      box-shadow: none !important;
      border: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      width: auto !important;
      border-radius: 0 !important;
    }
    .modal-bar, .no-print { display: none !important; }
    .sign-stage { background: #fff !important; padding: 0 !important; }
    .page {
      margin: 0 auto;
      box-shadow: none !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      page-break-after: avoid;
      page-break-inside: avoid;
    }
    .page.size-a4 { width: 210mm; height: 297mm; }
    .page.size-a5 { width: 148mm; height: 210mm; }
    .page.size-a6 { width: 105mm; height: 148mm; }
    .page.size-sticker { width: 100mm; height: 140mm; }
    @page { size: A4 portrait; margin: 0; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Facility Feedback Admin</h1>
      <p>Create facilities, auto-generate IDs, QR/NFC URLs, and printable signs.</p>
    </div>
    <a class="btn btn-ghost btn-sm" href="facility-feedback.html" target="_blank">Open guest form</a>
  </header>

  <div class="wrap">
    <aside class="panel">
      <h2>Add Facility</h2>
      <form id="createForm">
        <label for="typeCode">Facility type</label>
        <select id="typeCode" required></select>

        <label for="name">Facility name</label>
        <input id="name" placeholder="e.g. Prayer Room" required>

        <label for="property">Property</label>
        <input id="property" placeholder="e.g. Resort A" required>

        <label for="location">Location</label>
        <input id="location" placeholder="e.g. Lobby – Level 1" required>

        <div class="row2">
          <div>
            <label for="building">Building</label>
            <input id="building" placeholder="Optional">
          </div>
          <div>
            <label for="floor">Floor</label>
            <input id="floor" placeholder="Optional">
          </div>
        </div>

        <label for="zone">Zone / Area</label>
        <input id="zone" placeholder="Optional">

        <label for="notes">Internal notes</label>
        <textarea id="notes" placeholder="Installer notes, NFC UID, etc."></textarea>

        <button class="btn btn-primary" type="submit">Create facility</button>
      </form>
    </aside>

    <main class="panel">
      <h2>Facilities</h2>
      <div class="settings-inline">
        <div>
          <label for="baseUrl">Public feedback base URL</label>
          <input id="baseUrl" placeholder="https://feedback.yourdomain.com  (or …/facility-feedback.html for local)">
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="saveSettings">Save URL</button>
      </div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search name, ID, property…">
        <button type="button" class="btn btn-ghost btn-sm" id="exportBtn">Export JSON</button>
        <label class="btn btn-ghost btn-sm" style="margin:0; text-transform:none; letter-spacing:0; font-size:0.78rem; cursor:pointer;">
          Import JSON
          <input type="file" id="importFile" accept="application/json" hidden>
        </label>
      </div>
      <div id="list"></div>
    </main>
  </div>

  <div class="modal" id="printModal" role="dialog" aria-modal="true">
    <div class="modal-inner">
      <div class="modal-bar no-print">
        <div>
          <strong id="modalTitle">Print sign</strong>
          <div class="muted" id="modalUrls" style="font-size:0.78rem; margin-top:4px;"></div>
        </div>
        <div class="size-tabs">
          <button type="button" class="btn btn-ghost btn-sm is-on" data-size="a4">A4</button>
          <button type="button" class="btn btn-ghost btn-sm" data-size="a5">A5</button>
          <button type="button" class="btn btn-ghost btn-sm" data-size="a6">A6</button>
          <button type="button" class="btn btn-ghost btn-sm" data-size="sticker">Sticker</button>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-ghost btn-sm" id="copyQrUrl">Copy QR URL</button>
          <button type="button" class="btn btn-ghost btn-sm" id="copyNfcUrl">Copy NFC URL</button>
          <button type="button" class="btn btn-primary btn-sm" id="printBtn" style="width:auto;">Print</button>
          <button type="button" class="btn btn-ghost btn-sm" id="closeModal">Close</button>
        </div>
      </div>

      <div class="sign-stage">
        <main class="page size-a4" id="sign">
          <svg class="frame" viewBox="0 0 1000 1400" preserveAspectRatio="none" aria-hidden="true">
            <path d="M44 0 H956 C956 24 976 44 1000 44 V1356 C976 1356 956 1376 956 1400 H44 C44 1376 24 1356 0 1356 V44 C24 44 44 24 44 0 Z"/>
          </svg>

          <div class="lotus-row">
            <div class="lotus-line"></div>
            <svg class="lotus" viewBox="0 0 60 45" aria-hidden="true">
              <path d="M30 40 C20 32 18 22 30 7 C42 22 40 32 30 40"/>
              <path d="M28 40 C17 39 9 32 7 22 C18 22 26 29 28 40"/>
              <path d="M32 40 C43 39 51 32 53 22 C42 22 34 29 32 40"/>
              <path d="M27 41 C15 44 6 40 3 31 C14 29 23 33 27 41"/>
              <path d="M33 41 C45 44 54 40 57 31 C46 29 37 33 33 41"/>
            </svg>
            <div class="lotus-line"></div>
          </div>

          <div class="small-title">HOW WAS THE</div>

          <div class="divider lower-divider">
            <div class="divider-line"></div>
            <div class="divider-dot"></div>
            <div class="divider-line"></div>
          </div>

          <div class="qr-frame">
            <div id="signQr"></div>
          </div>

            <div class="nfc-row">
              <div class="nfc-line"></div>
              <svg class="nfc-icon" viewBox="0 0 40 40" aria-hidden="true">
                <path d="M8 17 C12 20 12 23 8 26"/>
                <path d="M14 11 C22 17 22 25 14 31"/>
                <path d="M21 6 C33 15 33 27 21 36"/>
              </svg>
              <div class="nfc-line"></div>
            </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  const typeSelect = document.getElementById('typeCode');
  const form = document.getElementById('createForm');
  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');
  const baseUrlEl = document.getElementById('baseUrl');
  const toast = document.getElementById('toast');
  const modal = document.getElementById('printModal');
  const sign = document.getElementById('sign');
  let currentFacility = null;
  let currentUrls = null;
  let qrInstance = null;
  let signSize = 'a4';

  Object.values(FacilityKit.FACILITY_TYPES).forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.code;
    opt.textContent = t.name + ' (' + t.code + ')';
    typeSelect.appendChild(opt);
  });

  function toastMsg(msg) {
    toast.textContent = msg;
    toast.classList.add('is-on');
    setTimeout(() => toast.classList.remove('is-on'), 1800);
  }

  function syncNamePlaceholder() {
    const t = FacilityKit.FACILITY_TYPES[typeSelect.value];
    if (t && !form.name.value) form.name.placeholder = t.name;
  }
  typeSelect.addEventListener('change', () => {
    const t = FacilityKit.FACILITY_TYPES[typeSelect.value];
    if (t) form.name.value = t.name;
    syncNamePlaceholder();
  });
  syncNamePlaceholder();
  const first = FacilityKit.FACILITY_TYPES[typeSelect.value];
  if (first) form.name.value = first.name;

  const settings = FacilityKit.loadSettings();
  baseUrlEl.value = settings.baseUrl || '';

  document.getElementById('saveSettings').addEventListener('click', () => {
    FacilityKit.saveSettings({
      baseUrl: baseUrlEl.value.trim(),
      feedbackPath: 'facility-feedback.html'
    });
    toastMsg('Base URL saved');
    renderList();
  });

  let facilitiesCache = [];

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Creating…';
    try {
      const facility = await FacilitySupabase.createFacility({
        typeCode: typeSelect.value,
        name: form.name.value,
        property: form.property.value,
        location: form.location.value,
        building: form.building.value,
        floor: form.floor.value,
        zone: form.zone.value,
        notes: form.notes.value
      });
      form.location.value = '';
      form.building.value = '';
      form.floor.value = '';
      form.zone.value = '';
      form.notes.value = '';
      await renderList();
      toastMsg('Created ' + facility.id);
      openPrint(facility);
    } catch (err) {
      console.error(err);
      alert('Could not create facility: ' + (err.message || err));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create facility';
    }
  });

  async function renderList() {
    const q = (searchEl.value || '').trim().toLowerCase();
    listEl.innerHTML = '<div class="empty">Loading…</div>';
    try {
      facilitiesCache = await FacilitySupabase.listFacilities();
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<div class="empty">Could not load facilities from Supabase.<br><small>' + esc(err.message || err) + '</small><br>Run supabase-facility-feedback.sql first.</div>';
      return;
    }

    const items = facilitiesCache.filter(f => {
      if (!q) return true;
      return [f.id, f.name, f.property, f.location, f.typeName, f.zone, f.building]
        .join(' ')
        .toLowerCase()
        .includes(q);
    });

    if (!items.length) {
      listEl.innerHTML = '<div class="empty">No facilities yet. Create one on the left.</div>';
      return;
    }

    const rows = items.map(f => {
      const urls = FacilityKit.urlsFor(f.id);
      return '<tr>' +
        '<td><div class="id">' + esc(f.id) + '</div><div class="muted">' + esc(f.typeName) + '</div></td>' +
        '<td><div><strong>' + esc(f.name) + '</strong></div>' +
        '<div class="muted">' + esc(f.property) + (f.location ? ' · ' + esc(f.location) : '') + '</div>' +
        '<div class="urls">QR: ' + esc(urls.qr) + '<br>NFC: ' + esc(urls.nfc) + '</div></td>' +
        '<td class="actions">' +
          '<button type="button" class="btn btn-ghost btn-sm" data-print="' + esc(f.id) + '">Print sign</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-copy-qr="' + esc(f.id) + '">Copy QR</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-copy-nfc="' + esc(f.id) + '">Copy NFC</button>' +
          '<button type="button" class="btn btn-danger btn-sm" data-del="' + esc(f.id) + '">Delete</button>' +
        '</td></tr>';
    }).join('');

    listEl.innerHTML = '<table><thead><tr><th>ID</th><th>Details / URLs</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  listEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.print) {
      const f = facilitiesCache.find(x => x.id === btn.dataset.print);
      if (f) openPrint(f);
    }
    if (btn.dataset.copyQr) {
      const u = FacilityKit.urlsFor(btn.dataset.copyQr);
      copyText(u.qr);
    }
    if (btn.dataset.copyNfc) {
      const u = FacilityKit.urlsFor(btn.dataset.copyNfc);
      copyText(u.nfc);
    }
    if (btn.dataset.del) {
      if (confirm('Delete ' + btn.dataset.del + '?')) {
        try {
          await FacilitySupabase.deleteFacility(btn.dataset.del);
          await renderList();
          toastMsg('Deleted');
        } catch (err) {
          alert('Delete failed: ' + (err.message || err));
        }
      }
    }
  });

  searchEl.addEventListener('input', () => renderList());

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => toastMsg('Copied')).catch(() => {
      prompt('Copy URL:', text);
    });
  }

  function openPrint(facilityOrId) {
    currentFacility = typeof facilityOrId === 'object'
      ? facilityOrId
      : (facilitiesCache.find(f => f.id === facilityOrId) || FacilityKit.getFacility(facilityOrId));
    if (!currentFacility) return;
    currentUrls = FacilityKit.urlsFor(currentFacility.id);
    document.getElementById('modalTitle').textContent = 'Print sign · ' + currentFacility.id;
    document.getElementById('modalUrls').innerHTML =
      'QR: ' + esc(currentUrls.qr) + '<br>NFC: ' + esc(currentUrls.nfc);
    document.getElementById('signName').textContent = (currentFacility.name || currentFacility.typeName).toUpperCase() + '?';
    document.getElementById('signId').textContent = currentFacility.id;
    fitTitle();
    setSignSize(signSize);
    modal.classList.add('is-on');
    // Wait a tick so layout sizes are correct for QR pixels
    requestAnimationFrame(() => renderQr(currentUrls.qr));
  }

  function setSignSize(size) {
    signSize = size;
    sign.classList.remove('size-a4', 'size-a5', 'size-a6', 'size-sticker');
    sign.classList.add('size-' + size);
    document.querySelectorAll('.size-tabs button').forEach(b => {
      b.classList.toggle('is-on', b.dataset.size === size);
    });
    fitTitle();
    if (currentUrls) requestAnimationFrame(() => renderQr(currentUrls.qr));
  }

  function renderQr(url) {
    const box = document.getElementById('signQr');
    box.innerHTML = '';
    const frame = box.parentElement.getBoundingClientRect();
    // Generate denser QR for crisp print (2x display size, min 220)
    const cssPx = Math.max(90, Math.floor(Math.min(frame.width, frame.height) * 0.96));
    const px = Math.max(220, cssPx * 2);
    qrInstance = new QRCode(box, {
      text: url,
      width: px,
      height: px,
      correctLevel: QRCode.CorrectLevel.H,
      colorDark: '#173b30',
      colorLight: '#ffffff'
    });
  }

  function fitTitle() {
    const el = document.getElementById('signName');
    const len = (el.textContent || '').length;
    el.classList.toggle('is-long', len > 14);
    el.classList.toggle('is-xl', len > 20);
  }

  document.querySelectorAll('.size-tabs button').forEach(b => {
    b.addEventListener('click', () => setSignSize(b.dataset.size));
  });
  document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('is-on'));
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('copyQrUrl').addEventListener('click', () => currentUrls && copyText(currentUrls.qr));
  document.getElementById('copyNfcUrl').addEventListener('click', () => currentUrls && copyText(currentUrls.nfc));
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('is-on'); });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ facilities: facilitiesCache }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'facility-registry.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById('importFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.facilities)) throw new Error('Invalid registry');
      let n = 0;
      for (const f of data.facilities) {
        try {
          const typeCode = f.typeCode || (f.id || '').split('-')[0];
          const type = FacilityKit.FACILITY_TYPES[typeCode];
          await FacilitySupabase.upsertFacility({
            id: f.id,
            typeCode,
            typeName: f.typeName || (type && type.name) || typeCode,
            name: f.name,
            property: f.property,
            location: f.location,
            building: f.building,
            floor: f.floor,
            zone: f.zone,
            notes: f.notes,
            active: f.active !== false,
            createdAt: f.createdAt || f.created_at
          });
          n++;
        } catch (err) {
          console.warn('Skip import row', f, err);
        }
      }
      await renderList();
      toastMsg('Imported ' + n + ' facilities');
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
    e.target.value = '';
  });

  renderList();
})();
</script>
